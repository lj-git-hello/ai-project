# Render 部署配置（Infrastructure as Code）
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-assistant-api
    runtime: node
    plan: free
    # 从 GitHub 仓库的 ai-server 子目录构建
    rootDir: ai-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 对话模型：火山引擎方舟（在控制台手动填，不入库）
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: CHAT_MODEL
        sync: false
      # Embedding 模型：阿里云百炼
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        value: https://ws-lni3s5bm8fy9o869.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - key: EMBEDDING_MODEL
        value: qwen3.7-text-embedding
      - key: EMBEDDING_DIMENSIONS
        value: '1024'